root = "."
tmp_dir = "dev"

[build]
  cmd = "go build -buildvcs=false -o ./dev/main ./cmd"
  bin = "dev/main"
  full_bin = "./dev/main serve"
  include_ext = ["go", "sql", "json"]
  exclude_dir = ["bin", "dev", "docs", "vendor"]
  exclude_regex = ["_test\\.go"]
  exclude_unchanged = true
  follow_symlink = true
  log = "air.log"
  delay = 1000
  stop_on_error = true
  send_interrupt = true
  kill_delay = "2s"

[log]
  time = false

[color]
  main = "magenta"
  watcher = "cyan"
  build = "yellow"
  runner = "green"

[misc]
  clean_on_exit = true
