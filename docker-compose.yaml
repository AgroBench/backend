services:
  api:
    container_name: agrobench-api
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
    env_file:
      - .env
    environment:
      PORT: ${PORT:-8080}
      DATABASE_URL: postgres://agrobench:agrobench@db:5432/agrobench?sslmode=disable
      CONFIG_FILE: config/env/config.dev.json
      AUTH_PEPPER: ${AUTH_PEPPER}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ENCLAVE_MOCK_BOX_PRIVATE_KEY: ${ENCLAVE_MOCK_BOX_PRIVATE_KEY:-}
      ENCLAVE_MOCK_SIGNING_PRIVATE_SEED: ${ENCLAVE_MOCK_SIGNING_PRIVATE_SEED:-}
    volumes:
      - .:/api
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - agrobench

  db:
    container_name: agrobench-db
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: agrobench
      POSTGRES_PASSWORD: agrobench
      POSTGRES_DB: agrobench
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agrobench -d agrobench"]
      interval: 3s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks:
      - agrobench

volumes:
  pg-data:
  go-mod-cache:
  go-build-cache:

networks:
  agrobench:
    driver: bridge
